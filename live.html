<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flixly — Rendu live</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .box { max-width: 420px; margin: 3.5rem auto; padding: 1.4rem; border: 1px solid var(--line); border-radius: 16px; background: var(--bg-card); text-align: center; }
    .box img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); margin: 1rem 0; }
    .meta { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header class="nav"><div class="wrap nav-inner">
    <a class="logo" href="index.html">Flix<span>ly</span></a>
    <a class="btn btn-ghost" href="index.html">← Landing</a>
  </div></header>
  <div class="box">
    <p class="hero-kicker" style="margin:0">pipeline</p>
    <h1 style="font-size:1.4rem;margin:0.4rem 0">Latest render</h1>
    <img id="r" src="assets/latest.svg" alt="Rendu Flixly" width="800" height="800" />
    <p class="meta" id="s"></p>
  </div>
  <script>
    var v=Date.now();
    document.getElementById('r').src='assets/latest.svg?v='+v;
    document.getElementById('s').textContent='Flixly · '+v;
  </script>
</body>
</html>
