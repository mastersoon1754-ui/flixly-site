<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flixly — Live render</title>
  <style>
    :root { color-scheme: dark; --bg: #07080c; --card: #151922; --text: #f2f4f8; --muted: #9aa3b2; --accent: #8b7cff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
      display: grid; place-items: center; padding: 2rem; }
    main { width: min(420px, 100%); background: var(--card); border-radius: 16px; padding: 1.5rem; text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.4); border: 1px solid rgba(139,124,255,.25); }
    .brand { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 .75rem; font-weight: 600; }
    h1 { font-size: 1.25rem; margin: 0 0 .35rem; font-weight: 600; }
    p { margin: 0 0 1rem; color: var(--muted); font-size: .9rem; }
    img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: #2a2f3a; display: block; }
    .meta { margin-top: .75rem; font-size: .75rem; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="brand">Flixly</p>
    <h1>Latest render</h1>
    <p>Pipeline target — overwritten on each success.</p>
    <img id="render" src="assets/latest.svg" alt="Flixly latest cartoon render" width="800" height="800" />
    <p class="meta" id="stamp">…</p>
    <p class="meta"><a href="index.html">← Landing</a> · <a href="https://flixly.me">flixly.me</a></p>
  </main>
  <script>
    var img = document.getElementById('render');
    var v = Date.now();
    img.src = 'assets/latest.svg?v=' + v;
    document.getElementById('stamp').textContent = 'Flixly · ' + v;
  </script>
</body>
</html>
